server.port=8080
server.servlet.context-path=/webhook
spring.application.name=webhook
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL:http://identity.shopapp.local}/realms/shopapp

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/webhook}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

springdoc.swagger-ui.path=/swagger-ui
springdoc.packagesToScan=com.shopapp.webhook

# CDC topics (decisions.md 5-32): consumer group "webhook" from the latest offset (history is not re-sent);
# a topic that does not exist yet (the order connector registers later) is picked up when it appears
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=webhook
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.allow.auto.create.topics=false
spring.kafka.consumer.properties.metadata.max.age.ms=30000
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
shopapp.webhook.cdc.product-topic=dbproduct.public.product
shopapp.webhook.cdc.order-topic=dborder.public.order
# Retried in place (search's 4-70 design): database unavailable -> 1 s doubling to 2 min, without an end;
# other failures -> 2 retries 1 s apart; poison -> <topic>-webhook-dlt at once
shopapp.webhook.cdc.retry.initial-interval-ms=1000
shopapp.webhook.cdc.retry.multiplier=2
shopapp.webhook.cdc.retry.max-interval-ms=120000
shopapp.webhook.cdc.retry.other-attempts=2
shopapp.webhook.cdc.retry.other-interval-ms=1000

# Deliveries (decisions.md 5-33, 5-34): a worker sends due log rows, never the consumer
shopapp.webhook.delivery.connect-timeout-ms=2000
shopapp.webhook.delivery.read-timeout-ms=5000
shopapp.webhook.delivery.total-timeout-ms=10000
shopapp.webhook.delivery.max-attempts=3
shopapp.webhook.delivery.initial-backoff-ms=10000
shopapp.webhook.delivery.backoff-multiplier=6
shopapp.webhook.delivery.max-concurrent=8
shopapp.webhook.delivery.poll-interval-ms=1000
shopapp.webhook.delivery.lease-ms=60000
shopapp.webhook.delivery.max-payload-bytes=65536
# Hosts exempt from the private-address refusal (exact host names), e.g. a receiver on the compose network
shopapp.webhook.allowed-hosts=${WEBHOOK_ALLOWED_HOSTS:}
