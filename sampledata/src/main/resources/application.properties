server.port=8080
server.servlet.context-path=/sampledata
spring.application.name=sampledata
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL:http://identity.shopapp.local}/realms/shopapp

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# No database of its own: the product database, as the "sampledata" login that may only SELECT/INSERT the catalog
# tables and republish products (docker/postgres/sampledata-grants.sql, decisions.md 5-53). The sample SQL never runs
# on startup, only on POST /backoffice/sampledata.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/product}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sampledata}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sampledata-dev}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:2}
spring.datasource.hikari.minimum-idle=0
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.liquibase.enabled=false

springdoc.swagger-ui.path=/swagger-ui
springdoc.packagesToScan=com.shopapp.sampledata
