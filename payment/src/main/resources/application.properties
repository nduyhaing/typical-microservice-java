server.port=8080
server.servlet.context-path=/payment
spring.application.name=payment
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL:http://identity.shopapp.local}/realms/shopapp

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

springdoc.swagger-ui.path=/swagger-ui
springdoc.packagesToScan=com.shopapp.payment

# order (amount, owner and payment state of an order; mark it paid) and payment-paypal, both internal endpoints
# called straight on the network with the payment service's own token (decisions.md 5-11, 5-20)
shopapp.services.order=${SHOPAPP_SERVICES_ORDER:http://api.shopapp.local/order}
shopapp.services.payment-paypal=${SHOPAPP_SERVICES_PAYMENT_PAYPAL:http://localhost:8094/payment-paypal}
# the payment service's own Keycloak client (client credentials, realm role SERVICE) (decisions.md 5-11)
shopapp.service-auth.token-uri=${SHOPAPP_SERVICE_AUTH_TOKEN_URI:${KEYCLOAK_URL:http://identity.shopapp.local}/realms/shopapp/protocol/openid-connect/token}
shopapp.service-auth.client-id=${PAYMENT_SERVICE_CLIENT_ID:payment-service}
shopapp.service-auth.client-secret=${PAYMENT_SERVICE_CLIENT_SECRET:}
# completed payments order has not accepted yet are retried this often (back-off per payment, decisions.md 5-61)
shopapp.payment.reconcile-interval=${PAYMENT_RECONCILE_INTERVAL:PT1M}
