listen_addresses = '*'
# logical replication is required by Debezium CDC (slice 4)
wal_level = logical
max_wal_senders = 10
max_replication_slots = 10
# A replication slot keeps WAL until its consumer confirms it. If Debezium (kafka-connect) stops for a long time
# the product_slot would keep WAL forever and fill the disk; past this size Postgres drops the WAL and marks the
# slot lost instead (the connector then needs a new snapshot - see README "CDC"). Reloadable (SIGHUP).
max_slot_wal_keep_size = 1GB
# ~12 Spring services (pool 5 each), Keycloak (pool <= 20), Debezium, pgAdmin and the smoke script share this server
max_connections = 200
