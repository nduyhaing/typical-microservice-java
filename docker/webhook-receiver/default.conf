# Webhook test receiver (decisions.md 5-37): one JSON line per request on stdout with the webhook headers and the
# exact body ($request_body is only filled when the body is proxied, hence the loopback hop to the 200 answer).
log_format webhook escape=json '{"time":"$time_iso8601","method":"$request_method","uri":"$request_uri",'
    '"event":"$http_x_shopapp_event","delivery":"$http_x_shopapp_delivery",'
    '"timestamp":"$http_x_shopapp_timestamp","signature":"$http_x_hub_signature_256",'
    '"contentType":"$content_type","body":"$request_body"}';

server {
    listen 8080;
    client_max_body_size 1m;
    # keep the body in memory so $request_body is set
    client_body_buffer_size 1m;

    location / {
        access_log /dev/stdout webhook;
        proxy_pass http://127.0.0.1:8081;
    }
}

server {
    listen 127.0.0.1:8081;
    access_log off;

    location / {
        default_type application/json;
        return 200 '{"received":true}';
    }
}
