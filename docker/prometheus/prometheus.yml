# Prometheus (decisions.md 6-8): the services' metrics arrive over OTLP from the collector (--web.enable-otlp-receiver);
# the service name (resource attribute service.name) becomes the `job` label. Only the consumer-lag exporter and
# Prometheus itself are scraped.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

otlp:
  # also keep service.name as a label of its own, next to job
  promote_resource_attributes:
    - service.name
    - service.instance.id

storage:
  tsdb:
    # OTLP pushes from many services may arrive slightly out of order
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
