server.port=8080
server.servlet.context-path=/customer
spring.application.name=customer
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL:http://identity.shopapp.local}/realms/shopapp

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/customer}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

springdoc.swagger-ui.path=/swagger-ui
springdoc.packagesToScan=com.shopapp.customer
spring.liquibase.contexts=${SPRING_LIQUIBASE_CONTEXTS:default}

# Keycloak admin API, client-credentials with the customer-management service account (YAS)
keycloak.auth-server-url=${KEYCLOAK_ADMIN_URL:http://identity.shopapp.local}
keycloak.realm=shopapp
keycloak.resource=customer-management
keycloak.credentials.secret=${CUSTOMER_MANAGEMENT_CLIENT_SECRET:}
