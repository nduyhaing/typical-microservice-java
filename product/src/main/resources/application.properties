server.port=8080
server.servlet.context-path=/product
spring.application.name=product
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL:http://identity.shopapp.local}/realms/shopapp

# Not configured in slice 2a: product images fall back to empty URLs (decisions.md S2-4)
shopapp.services.media=${SHOPAPP_SERVICES_MEDIA:}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/product}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
# empty = no sample data; docker compose sets sample-data via .env (decisions.md 2a-2)
spring.liquibase.contexts=${SPRING_LIQUIBASE_CONTEXTS:}

springdoc.swagger-ui.path=/swagger-ui
springdoc.packagesToScan=com.shopapp.product
