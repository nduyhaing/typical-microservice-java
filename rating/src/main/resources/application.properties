server.port=8080
server.servlet.context-path=/rating
spring.application.name=rating
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL:http://identity.shopapp.local}/realms/shopapp

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rating}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

springdoc.swagger-ui.path=/swagger-ui
springdoc.packagesToScan=com.shopapp.rating

# Order (did the customer buy the product?) with the customer's token, and product (product name), straight to the
# containers in docker compose (decisions.md 4-31)
shopapp.services.order=${SHOPAPP_SERVICES_ORDER:http://localhost:8080/order}
shopapp.services.product=${SHOPAPP_SERVICES_PRODUCT:http://localhost:8080/product}
