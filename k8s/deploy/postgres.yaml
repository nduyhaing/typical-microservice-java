# PostgreSQL 16 managed by the CloudNativePG operator (scripts/k8s-up.sh installs it), the counterpart of the
# compose "postgres" service with docker/postgres/postgresql.conf. The ConfigMap shopapp-postgres-sql (created by
# scripts/k8s-up.sh from postgres_init.sql and docker/postgres/*.sql, so there is one copy of the SQL) feeds the Jobs.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shopapp-postgres
  namespace: shopapp
spec:
  instances: 1
  # "standard" image: includes pgvector (recommendation's embeddings)
  imageName: ghcr.io/cloudnative-pg/postgresql:16.16-standard-trixie
  storage:
    size: 4Gi
  bootstrap:
    initdb:
      # first database + its owner "admin" (Secret shopapp-postgres from .env POSTGRES_USER/POSTGRES_PASSWORD);
      # postgres_init.sql creates the other databases owned by admin (the postgres-init Job below)
      database: keycloak
      owner: admin
      secret:
        name: shopapp-postgres
      postInitApplicationSQL:
        # same as compose, where POSTGRES_USER is the superuser: the services log in as admin, Liquibase creates
        # extensions (pgvector), debezium-user.sql grants REPLICATION. Dev setup only (decisions.md 6-24)
        - ALTER ROLE admin SUPERUSER
  postgresql:
    parameters:
      # Debezium CDC (also CloudNativePG's default)
      wal_level: logical
      # a stuck product_slot must not fill the volume (decisions.md 4-6)
      max_slot_wal_keep_size: 1GB
      # ~15 services (pool 5), Keycloak (pool 20), Debezium, the init Jobs
      max_connections: "200"
      shared_buffers: 128MB
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
---
# The services, Keycloak, Debezium and the Jobs connect to "postgres", as in compose: an alias of the operator's
# read-write Service (always the primary).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: shopapp
spec:
  type: ExternalName
  externalName: shopapp-postgres-rw.shopapp.svc.cluster.local
---
# Creates the per-service databases and the NOLOGIN debezium role from postgres_init.sql (compose runs it from
# docker-entrypoint-initdb.d). CREATE DATABASE has no IF NOT EXISTS: on a rerun psql reports "already exists" and
# carries on (no ON_ERROR_STOP); the Job then fails unless every database of the file exists.
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init
  namespace: shopapp
spec:
  backoffLimit: 20
  activeDeadlineSeconds: 1200
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: postgres:16.16
          command: ["bash", "-ec"]
          args:
            - |
              until pg_isready -q -h postgres -d postgres; do echo "waiting for postgres"; sleep 3; done
              psql -h postgres -d postgres -f /sql/postgres_init.sql
              missing=""
              for db in $(sed -nE 's/^CREATE DATABASE "?([a-z_]+)"?.*/\1/p' /sql/postgres_init.sql); do
                [ "$(psql -h postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$db'")" = 1 ] \
                  || missing="$missing $db"
              done
              [ -z "$missing" ] || { echo "missing databases:$missing" >&2; exit 1; }
              echo "all databases exist"
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: shopapp-postgres
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopapp-postgres
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: shopapp-postgres-sql
