# Kafka (KRaft, single node), Kafka Connect with Debezium, and the connector registrar: the compose services kafka,
# kafka-connect and kafka-connect-init as plain manifests with the same images and settings. Not Strimzi: its
# KafkaConnect needs a Strimzi-built image (a registry to push the Debezium plugin build to) and the operator costs
# memory a one-broker dev cluster does not need (decisions.md 6-25).
# ConfigMaps (scripts/k8s-up.sh): kafka-connect-init = kafka/register-connectors.sh, kafka-connectors = kafka/connects/*.json.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: shopapp
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: shopapp
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: shopapp
    spec:
      automountServiceAccountToken: false
      # the image turns every KAFKA_* variable into a broker setting: no KAFKA_PORT=tcp://... service links
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka
          image: apache/kafka:4.4.0
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            # the controller talks to itself; the Service only has endpoints once the broker is ready
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: KAFKA_HEAP_OPTS
              value: -Xms256m -Xmx512m
          ports:
            - name: kafka
              containerPort: 9092
          readinessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 60
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 640Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: shopapp
spec:
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  namespace: shopapp
  labels:
    app.kubernetes.io/name: kafka-connect
    app.kubernetes.io/part-of: shopapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-connect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-connect
        app.kubernetes.io/part-of: shopapp
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka-connect
          image: quay.io/debezium/connect:3.7.1.Final
          env:
            - name: BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: GROUP_ID
              value: shopapp-connect
            - name: CONFIG_STORAGE_TOPIC
              value: connect-configs
            - name: OFFSET_STORAGE_TOPIC
              value: connect-offsets
            - name: STATUS_STORAGE_TOPIC
              value: connect-statuses
            - name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_HEAP_OPTS
              value: -Xms256m -Xmx512m
            # connector configs say ${env:DEBEZIUM_DB_PASSWORD}; the worker resolves it (decisions.md 4-5)
            - name: CONNECT_CONFIG_PROVIDERS
              value: env
            - name: CONNECT_CONFIG_PROVIDERS_ENV_CLASS
              value: org.apache.kafka.common.config.provider.EnvVarConfigProvider
            - name: CONNECT_CONFIG_PROVIDERS_ENV_PARAM_ALLOWLIST_PATTERN
              value: ^DEBEZIUM_DB_.*$
            - name: DEBEZIUM_DB_USER
              valueFrom:
                secretKeyRef:
                  name: shopapp-debezium
                  key: username
            - name: DEBEZIUM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopapp-debezium
                  key: password
          ports:
            - name: http
              containerPort: 8083
          readinessProbe:
            httpGet:
              path: /connectors
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /connectors
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 640Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
  namespace: shopapp
spec:
  selector:
    app.kubernetes.io/name: kafka-connect
  ports:
    - name: http
      port: 8083
      targetPort: http
---
# Registers kafka/connects/*.json (PUT .../config, idempotent), then every 30 s re-registers a deleted connector and
# restarts FAILED ones - the same script as compose's kafka-connect-init (decisions.md 4-4). A Deployment, not a Job,
# because the script keeps running; it restarts until debezium-db-init has created the login and publication.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect-init
  namespace: shopapp
  labels:
    app.kubernetes.io/name: kafka-connect-init
    app.kubernetes.io/part-of: shopapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-connect-init
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-connect-init
        app.kubernetes.io/part-of: shopapp
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: register
          image: curlimages/curl:8.23.0
          # the script reads connects/*.json next to itself: assemble that layout in an emptyDir, so every file of
          # kafka/connects (one ConfigMap key each) is registered without listing them here
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mkdir -p /work/connects
              cp /src/script/register-connectors.sh /work/
              cp /src/connects/*.json /work/connects/
              exec /bin/sh /work/register-connectors.sh
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/registered"]
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: script
              mountPath: /src/script
              readOnly: true
            - name: connects
              mountPath: /src/connects
              readOnly: true
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: kafka-connect-init
        - name: connects
          configMap:
            name: kafka-connectors
        - name: work
          emptyDir:
            sizeLimit: 8Mi
        - name: tmp
          emptyDir:
            sizeLimit: 8Mi
