# kind cluster for shop_app (scripts/k8s-up.sh). One node; ingress-nginx's kind manifest runs the controller on the
# node labelled ingress-ready with hostPort 80, published on the host's loopback at K8S_HTTP_PORT (k8s-up.sh replaces
# 8000). Loopback only, like compose: the dev credentials must not be reachable from the LAN.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8000
        listenAddress: "127.0.0.1"
        protocol: TCP
