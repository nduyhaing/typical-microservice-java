# sampledata: values for the shopapp-service library chart (defaults and every key:
# k8s/charts/shopapp-service/templates/_helpers.tpl). Image: <global.imageRegistry>/shopapp-sampledata:<tag>.
name: sampledata
kind: spring
contextPath: /sampledata
# no database of its own: the catalog-only "sampledata" login in the product DB (decisions.md 5-53), created by
# the sampledata-db-init Job in k8s/deploy
database:
  enabled: true
  name: product
  secret: shopapp-sampledata-db
  maxPoolSize: 2
env:
  KEYCLOAK_URL: '{{ include "shopapp-service.publicUrl" (list . "identity") }}'
jvm:
  options: "-Xmx256m -Xss512k -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=64m -XX:+UseSerialGC"
resources:
  requests:
    memory: 448Mi
  limits:
    memory: 640Mi
