server.port=8080
server.servlet.context-path=/search
spring.application.name=search
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL:http://identity.shopapp.local}/realms/shopapp

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

springdoc.swagger-ui.path=/swagger-ui
springdoc.packagesToScan=com.shopapp.search

# Elasticsearch (security on, plain HTTP inside the compose network, decisions.md 4-17)
spring.elasticsearch.uris=${ELASTICSEARCH_URL:http://localhost:9200}
spring.elasticsearch.username=${ELASTICSEARCH_USERNAME:}
spring.elasticsearch.password=${ELASTICSEARCH_PASSWORD:}
spring.elasticsearch.connection-timeout=2s
spring.elasticsearch.socket-timeout=10s

# Product CDC topic (decisions.md 4-2), consumer group "search" from the earliest offset (fills an empty index)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=search
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
search.cdc.topic=dbproduct.public.product
# 4 attempts: now, +2 s, +10 s, +50 s on retry topics, then dbproduct.public.product-dlt
search.cdc.retry.attempts=4
search.cdc.retry.delay-ms=2000
search.cdc.retry.multiplier=5

# Product (products-es detail for indexing; back office list for the reindex, with the admin's token)
shopapp.services.product=${SHOPAPP_SERVICES_PRODUCT:http://localhost:8080/product}
