# Observability add-on (decisions.md 6-6..6-16): OpenTelemetry collector, Prometheus, Loki, Tempo, Grafana and a
# Kafka consumer-lag exporter, plus the OTLP endpoint for every Spring service. Off by default (memory); turn it on
# by adding this file:
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# and off again with a plain `docker compose up -d` (the services are recreated without the OTLP endpoint, so they
# stop exporting) followed by (volumes are kept)
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml rm -sf otel-collector prometheus loki \
#     tempo grafana kafka-exporter
#
# Grafana: http://grafana.${DOMAIN} (hosts entry needed, see README). No other port is published.

# Spring Boot maps OTEL_EXPORTER_OTLP_ENDPOINT to the traces, logs and metrics endpoints (/v1/traces, ...); without
# it common-library exports nothing (decisions.md 6-1).
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol/config.yml"]
    environment:
      # soft limit below mem_limit; the memory_limiter processor refuses data before the container is killed
      GOMEMLIMIT: 220MiB
    mem_limit: 320m
    volumes:
      - ./docker/otel-collector/otelcol-config.yml:/etc/otelcol/config.yml:ro
    # distroless image (no shell, no wget): no healthcheck; the health_check extension listens on :13133
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    restart: unless-stopped
    networks:
      - shopapp-network

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      # the collector pushes the services' metrics over OTLP (decisions.md 6-8)
      - --web.enable-otlp-receiver
    mem_limit: 384m
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - shopapp-network

  loki:
    image: grafana/loki:3.7.10
    command: ["-config.file=/etc/loki/loki.yaml"]
    mem_limit: 384m
    volumes:
      - ./docker/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    # distroless image (no shell, no wget): no healthcheck; readiness is http://loki:3100/ready
    networks:
      - shopapp-network

  tempo:
    image: grafana/tempo:2.10.10
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    mem_limit: 384m
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    # distroless image (no shell, no wget): no healthcheck; readiness is http://tempo:3200/ready
    networks:
      - shopapp-network

  grafana:
    image: grafana/grafana:12.4.15
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # read-only dashboards without login; nginx listens on loopback only (decisions.md 6-11)
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SERVER_ROOT_URL: http://grafana.${DOMAIN}:${NGINX_HTTP_PORT}/
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # no background download of the bundled app plugins (drilldown apps) at start-up
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    mem_limit: 256m
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    networks:
      - shopapp-network

  # consumer-group lag of search / recommendation / webhook (and every other group), scraped by Prometheus
  # (decisions.md 6-10)
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.11.0
    command: ["--kafka.server=kafka:9092", "--kafka.version=3.9.0"]
    mem_limit: 64m
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - shopapp-network

  # every Spring service exports traces, metrics and logs to the collector
  product:
    environment: *otel-env
  cart:
    environment: *otel-env
  customer:
    environment: *otel-env
  order:
    environment: *otel-env
  media:
    environment: *otel-env
  tax:
    environment: *otel-env
  location:
    environment: *otel-env
  inventory:
    environment: *otel-env
  promotion:
    environment: *otel-env
  rating:
    environment: *otel-env
  payment:
    environment: *otel-env
  payment-paypal:
    environment: *otel-env
  search:
    environment: *otel-env
  recommendation:
    environment: *otel-env
  webhook:
    environment: *otel-env
  sampledata:
    environment: *otel-env
  storefront-bff:
    environment: *otel-env
  backoffice-bff:
    environment: *otel-env

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
