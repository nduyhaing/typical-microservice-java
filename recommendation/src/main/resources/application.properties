server.port=8080
server.servlet.context-path=/recommendation
spring.application.name=recommendation
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL:http://identity.shopapp.local}/realms/shopapp

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

springdoc.swagger-ui.path=/swagger-ui
springdoc.packagesToScan=com.shopapp.recommendation

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/recommendation}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Product CDC topic (decisions.md 4-2), consumer group "recommendation" from the earliest offset (fills an empty table)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=recommendation
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
recommendation.cdc.topic=dbproduct.public.product
# blocking retries (decisions.md 5-42, search 4-70): product/Postgres down -> 1 s doubling to 2 min, without an end;
# other failures -> 2 retries 1 s apart, then dbproduct.public.product-recommendation-dlt; poison -> that DLT at once
recommendation.cdc.retry.initial-interval-ms=1000
recommendation.cdc.retry.multiplier=2
recommendation.cdc.retry.max-interval-ms=120000
recommendation.cdc.retry.other-attempts=2
recommendation.cdc.retry.other-interval-ms=1000

# Local embedding model (decisions.md 5-40): sentence-transformers/all-MiniLM-L6-v2 ONNX export (384 dimensions),
# pinned to a Hugging Face commit, downloaded once at first start into the cache directory (a volume in compose)
recommendation.embedding.model-url=https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/1110a243fdf4706b3f48f1d95db1a4f5529b4d41/onnx/model.onnx
recommendation.embedding.tokenizer-url=https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/1110a243fdf4706b3f48f1d95db1a4f5529b4d41/tokenizer.json
recommendation.embedding.cache-directory=${RECOMMENDATION_MODEL_CACHE:${java.io.tmpdir}/shopapp-onnx-model}
# at most this many similar products per request
recommendation.similarity.top-k=8

# Product (products-es gate + storefront detail for the document text; back office list for the reindex)
shopapp.services.product=${SHOPAPP_SERVICES_PRODUCT:http://localhost:8080/product}
