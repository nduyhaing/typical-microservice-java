server.port=8080
server.servlet.context-path=/payment-paypal
spring.application.name=payment-paypal
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL:http://identity.shopapp.local}/realms/shopapp

springdoc.swagger-ui.path=/swagger-ui
springdoc.packagesToScan=com.shopapp.payment.paypal

# PayPal REST (Orders v2), sandbox by default; empty credentials = not configured: every call answers 503 and the
# payment service hides the PayPal provider (decisions.md 5-21, 5-23)
shopapp.paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
shopapp.paypal.client-id=${PAYPAL_CLIENT_ID:}
shopapp.paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
# where PayPal sends the buyer back (it appends ?token=<PayPal order id>); the storefront page captures server-side
shopapp.paypal.return-url=${PAYPAL_RETURN_URL:http://storefront.shopapp.local/checkout/payment-return}
shopapp.paypal.cancel-url=${PAYPAL_CANCEL_URL:http://storefront.shopapp.local/checkout/payment-return?cancelled=true}
shopapp.paypal.brand-name=${PAYPAL_BRAND_NAME:shop_app}
