server.port=8080
server.servlet.context-path=/media
spring.application.name=media
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL:http://identity.shopapp.local}/realms/shopapp

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/media}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

springdoc.swagger-ui.path=/swagger-ui
springdoc.packagesToScan=com.shopapp.media

# uploads: at most 10 MB per file; the request may carry the multipart overhead on top (nginx client_max_body_size
# 11m in front, decisions.md 3b-23)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# read (and discard) oversized bodies up to this size so the client gets the error response instead of a reset
server.tomcat.max-swallow-size=12MB

# where the image files are stored (docker volume media-data)
file.directory=${FILE_DIRECTORY:/images/}
# browser-facing base URL of this service, used in MediaVm.url
shopapp.public-url.media=${SHOPAPP_PUBLIC_URL_MEDIA:http://api.shopapp.local/media}
