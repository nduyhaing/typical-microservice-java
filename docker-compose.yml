name: shopapp

services:
  postgres:
    # postgres 16.16 on Debian trixie (same as postgres:16.16, so the data volume and collations carry over) plus
    # the pgvector extension for recommendation's embeddings (decisions.md 5-46)
    image: pgvector/pgvector:0.8.7-pg16-trixie
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres_init.sql:/docker-entrypoint-initdb.d/postgres_init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - shopapp-network

  pgadmin:
    image: dpage/pgadmin4:9.19.0
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # .local is a reserved domain; allow it for the dev login email
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['local']"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin-data:/var/lib/pgadmin
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/misc/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopapp-network

  identity:
    image: quay.io/keycloak/keycloak:26.8.2
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_URL}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Keycloak's default heap is 70 % of the VM; cap it so the whole stack fits
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx768m
      # bound Keycloak's DB pool (Postgres max_connections is shared by every service)
      KC_DB_POOL_MAX_SIZE: 20
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # substituted into ${DOMAIN} placeholders of the realm import
      DOMAIN: ${DOMAIN}
    volumes:
      - ./identity/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      # the image has no curl/wget: plain HTTP over bash /dev/tcp to the management port
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopapp-network

  kafka:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s
    networks:
      - shopapp-network

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    environment:
      KAFKA_CLUSTERS_0_NAME: shopapp
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      # Kafka Connect tab (CDC connectors); the UI works without it when kafka-connect is down
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      DYNAMIC_CONFIG_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - shopapp-network

  # Change data capture (slice 4): Debezium streams public.product changes from Postgres to the Kafka topic
  # dbproduct.public.product (decisions.md 4-1..4-9). No host port: use Kafka UI (Kafka Connect tab) or
  # `docker compose exec kafka-connect curl localhost:8083/connectors?expand=status`.
  kafka-connect:
    image: quay.io/debezium/connect:3.7.1.Final
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: shopapp-connect
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-statuses
      # single broker
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      # connector configs say ${env:DEBEZIUM_DB_PASSWORD}; the worker resolves it, the REST API never shows it
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      CONNECT_CONFIG_PROVIDERS_ENV_PARAM_ALLOWLIST_PATTERN: ^DEBEZIUM_DB_.*$$
      DEBEZIUM_DB_USER: ${DEBEZIUM_DB_USER}
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - shopapp-network

  # one-shot: replication user, grants and publications in the product and order DBs (idempotent; needs their
  # tables) (decisions.md 4-3, 5-7)
  debezium-db-init:
    image: postgres:16.16
    command: ["sh", "-c", "psql -q -h postgres -U \"$$PGUSER\" -d product -f /sql/debezium-user.sql && psql -q -h postgres -U \"$$PGUSER\" -d order -f /sql/debezium-order.sql"]
    environment:
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DEBEZIUM_DB_USER: ${DEBEZIUM_DB_USER}
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD}
    volumes:
      - ./docker/postgres/debezium-user.sql:/sql/debezium-user.sql:ro
      - ./docker/postgres/debezium-order.sql:/sql/debezium-order.sql:ro
    depends_on:
      product:
        condition: service_healthy
      order:
        condition: service_healthy
    networks:
      - shopapp-network

  # registers the connectors in kafka/connects (PUT .../config, idempotent), then restarts FAILED ones every 30 s
  kafka-connect-init:
    image: curlimages/curl:8.17.0
    entrypoint: ["/bin/sh", "/kafka/register-connectors.sh"]
    # the first registration gives up after ~1 min (worker not ready); start over until it works
    restart: on-failure
    volumes:
      - ./kafka:/kafka:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/registered"]
      interval: 5s
      timeout: 3s
      retries: 60
    depends_on:
      kafka-connect:
        condition: service_healthy
      debezium-db-init:
        condition: service_completed_successfully
    networks:
      - shopapp-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.8
    # creates the search user (file realm) from .env, then starts Elasticsearch (decisions.md 4-17)
    entrypoint: ["/bin/tini", "--", "/bin/bash", "/shopapp/entrypoint.sh"]
    environment:
      discovery.type: single-node
      cluster.name: shopapp
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      # security on (YAS: off), plain HTTP inside the compose network, no host port
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      SEARCH_ES_USERNAME: ${SEARCH_ES_USERNAME}
      SEARCH_ES_PASSWORD: ${SEARCH_ES_PASSWORD}
      # dev machine: a nearly full Docker disk must not turn the index read-only
      cluster.routing.allocation.disk.threshold_enabled: "false"
    mem_limit: 1g
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - ./docker/elasticsearch:/shopapp:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"elastic:$${ELASTIC_PASSWORD}\" 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      - shopapp-network

  search:
    build: ./search
    image: shopapp/search:dev
    environment:
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: ${SEARCH_ES_USERNAME}
      ELASTICSEARCH_PASSWORD: ${SEARCH_ES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # products-es detail (public) and the reindex list (admin's token), straight to the container
      SHOPAPP_SERVICES_PRODUCT: http://product:8080/product
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /search/actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - shopapp-network

  # similar products from local text embeddings (ONNX all-MiniLM-L6-v2 + pgvector), fed by the product CDC topic
  # (decisions.md 5-40..5-49). The model (~90 MB) is downloaded from Hugging Face on the first start into the
  # recommendation-model volume; nginx does not wait for this service
  recommendation:
    build: ./recommendation
    image: shopapp/recommendation:dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/recommendation
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # products-es and storefront detail (public) and the reindex list (admin's token), straight to the container
      SHOPAPP_SERVICES_PRODUCT: http://product:8080/product
      # ONNX Runtime intra-op threads (its default is one per host core, decisions.md 5-71)
      RECOMMENDATION_ONNX_THREADS: "2"
    # heap 320m + metaspace + the ONNX model and its arenas (native); decisions.md 5-71
    mem_limit: 900m
    volumes:
      - recommendation-model:/var/cache/shopapp/onnx-model
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /recommendation/actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      # the first start downloads the model
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - shopapp-network

  product:
    build: ./product
    image: shopapp/product:dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/product
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_LIQUIBASE_CONTEXTS: ${PRODUCT_LIQUIBASE_CONTEXTS:-default}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      # in-network; any media failure falls back to placeholder images (decisions.md 2a-11)
      SHOPAPP_SERVICES_MEDIA: http://media:8080/media
    healthcheck:
      # the JRE image has no curl/wget and its sh is dash: plain HTTP over bash /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /product/actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopapp-network

  cart:
    build: ./cart
    image: shopapp/cart:dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cart
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      # in-network through the nginx alias, like the browser-facing API
      SHOPAPP_SERVICES_PRODUCT: http://api.${DOMAIN}:${NGINX_HTTP_PORT}/product
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /cart/actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopapp-network

  customer:
    build: ./customer
    image: shopapp/customer:dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/customer
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      # admin API straight to Keycloak on the compose network
      KEYCLOAK_ADMIN_URL: http://identity:8080
      CUSTOMER_MANAGEMENT_CLIENT_SECRET: ${CUSTOMER_MANAGEMENT_CLIENT_SECRET}
      # saved addresses: straight to the location container, with the customer's token (decisions.md 3c-33)
      SHOPAPP_SERVICES_LOCATION: http://location:8080/location
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /customer/actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
    networks:
      - shopapp-network

  order:
    build: ./order
    image: shopapp/order:dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      # stock subtract/restore are refused by nginx, so product is called straight on the network (3c-63)
      SHOPAPP_SERVICES_PRODUCT: http://product:8080/product
      # in-network through the nginx alias, like the browser-facing API
      SHOPAPP_SERVICES_CART: http://api.${DOMAIN}:${NGINX_HTTP_PORT}/cart
      # tax rates and saved addresses at order time, straight to the containers (decisions.md 3c-44)
      SHOPAPP_SERVICES_TAX: http://tax:8080/tax
      SHOPAPP_SERVICES_LOCATION: http://location:8080/location
      # coupon verify / apply-usage / release-usage, straight to the container (decisions.md 4-54)
      SHOPAPP_SERVICES_PROMOTION: http://promotion:8080/promotion
      # its own client-credentials token for product's / promotion's internal endpoints, straight to Keycloak on the
      # network (the token's issuer stays KEYCLOAK_URL) (decisions.md 5-5)
      SHOPAPP_SERVICE_AUTH_TOKEN_URI: http://identity:8080/realms/shopapp/protocol/openid-connect/token
      ORDER_SERVICE_CLIENT_SECRET: ${ORDER_SERVICE_CLIENT_SECRET}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /order/actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopapp-network

  media:
    build: ./media
    image: shopapp/media:dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/media
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      # browser-facing base of the image URLs (MediaVm.url); same port as the host uses
      SHOPAPP_PUBLIC_URL_MEDIA: http://api.${DOMAIN}:${NGINX_HTTP_PORT}/media
      FILE_DIRECTORY: /images/
    volumes:
      - media-data:/images
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /media/actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopapp-network

  tax:
    build: ./tax
    image: shopapp/tax:dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tax
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /tax/actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopapp-network

  location:
    build: ./location
    image: shopapp/location:dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/location
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /location/actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopapp-network

  inventory:
    build: ./inventory
    image: shopapp/inventory:dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      # straight to the containers, with the admin's token (decisions.md 3c-28)
      SHOPAPP_SERVICES_PRODUCT: http://product:8080/product
      SHOPAPP_SERVICES_LOCATION: http://location:8080/location
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /inventory/actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopapp-network

  promotion:
    build: ./promotion
    image: shopapp/promotion:dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/promotion
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      # straight to the container, with the caller's token (decisions.md 4-42)
      SHOPAPP_SERVICES_PRODUCT: http://product:8080/product
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /promotion/actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopapp-network

  rating:
    build: ./rating
    image: shopapp/rating:dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rating
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      # "did the customer buy it?" with the customer's token, and the product name, straight to the containers
      # (decisions.md 4-31, 4-35)
      SHOPAPP_SERVICES_ORDER: http://order:8080/order
      SHOPAPP_SERVICES_PRODUCT: http://product:8080/product
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /rating/actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopapp-network

  # payments (decisions.md 5-10..5-19): COD (admin-confirmed) and PayPal; the amount always comes from order's
  # internal endpoint, called with payment's own client-credentials token. nginx does not wait for it
  payment:
    build: ./payment
    image: shopapp/payment:dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      # internal endpoints (refused at the edge), straight to the containers
      SHOPAPP_SERVICES_ORDER: http://order:8080/order
      SHOPAPP_SERVICES_PAYMENT_PAYPAL: http://payment-paypal:8080/payment-paypal
      SHOPAPP_SERVICE_AUTH_TOKEN_URI: http://identity:8080/realms/shopapp/protocol/openid-connect/token
      PAYMENT_SERVICE_CLIENT_SECRET: ${PAYMENT_SERVICE_CLIENT_SECRET}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /payment/actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopapp-network

  # PayPal Orders v2 adapter, internal only (no nginx location; /payment-paypal/ is refused at the edge). Empty
  # PAYPAL_CLIENT_ID/SECRET = not configured: it answers 503 and the PayPal provider is hidden (decisions.md 5-20..5-29)
  payment-paypal:
    build: ./payment-paypal
    image: shopapp/payment-paypal:dev
    environment:
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      PAYPAL_BASE_URL: ${PAYPAL_BASE_URL:-https://api-m.sandbox.paypal.com}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_RETURN_URL: http://storefront.${DOMAIN}:${NGINX_HTTP_PORT}/checkout/payment-return
      PAYPAL_CANCEL_URL: http://storefront.${DOMAIN}:${NGINX_HTTP_PORT}/checkout/payment-return?cancelled=true
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /payment-paypal/actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - shopapp-network

  # webhooks (decisions.md 5-30..5-39): admin-registered URLs get signed product/order events from the CDC topics.
  # Private/loopback addresses are refused except the hosts in WEBHOOK_ALLOWED_HOSTS (the smoke's receiver below);
  # nginx does not wait for this service
  webhook:
    build: ./webhook
    image: shopapp/webhook:dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/webhook
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-webhook-receiver}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /webhook/actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - shopapp-network

  # test receiver for webhooks (smoke, live checks): logs each request (headers + exact body) as one JSON line on
  # stdout, answers 200; reuses the nginx image (~5 MB RAM), no host port (decisions.md 5-37)
  webhook-receiver:
    image: nginx:1.30.6
    volumes:
      - ./docker/webhook-receiver/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - shopapp-network

  # one-shot: the "sampledata" login and its catalog-only grants in the product DB (idempotent; needs product's
  # tables) (decisions.md 5-53)
  sampledata-db-init:
    image: postgres:16.16
    command: ["psql", "-q", "-h", "postgres", "-U", "${POSTGRES_USER}", "-d", "product", "-f", "/sql/sampledata-user.sql"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SAMPLEDATA_DB_PASSWORD: ${SAMPLEDATA_DB_PASSWORD}
    volumes:
      - ./docker/postgres/sampledata-user.sql:/sql/sampledata-user.sql:ro
      - ./docker/postgres/sampledata-grants.sql:/sql/sampledata-grants.sql:ro
    depends_on:
      product:
        condition: service_healthy
    networks:
      - shopapp-network

  # admin action "Load sample data": no database of its own, writes the product DB's catalog tables (5-50..5-54)
  sampledata:
    build: ./sampledata
    image: shopapp/sampledata:dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/product
      SPRING_DATASOURCE_USERNAME: sampledata
      SPRING_DATASOURCE_PASSWORD: ${SAMPLEDATA_DB_PASSWORD}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /sampledata/actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      sampledata-db-init:
        condition: service_completed_successfully
    networks:
      - shopapp-network

  redis:
    image: redis:7.4.12-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data
    networks:
      - shopapp-network

  storefront-bff:
    build: ./storefront-bff
    image: shopapp/storefront-bff:dev
    environment:
      # in-network: api.${DOMAIN} is an nginx alias; same port as the host uses
      API_BASE_URL: http://api.${DOMAIN}:${NGINX_HTTP_PORT}
      STOREFRONT_URL: http://storefront:3000
      # login: browser-facing Keycloak URL (token issuer) + direct back-channel URL (decisions.md 2b-6)
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_INTERNAL_URL: http://identity:8080
      STOREFRONT_BFF_CLIENT_SECRET: ${STOREFRONT_BFF_CLIENT_SECRET}
      REDIS_HOST: redis
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8087 && printf 'GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
      identity:
        condition: service_healthy
    networks:
      - shopapp-network

  backoffice-bff:
    build: ./backoffice-bff
    image: shopapp/backoffice-bff:dev
    environment:
      # in-network: api.${DOMAIN} is an nginx alias; same port as the host uses
      API_BASE_URL: http://api.${DOMAIN}:${NGINX_HTTP_PORT}
      # the Next.js back office (until it exists, page requests get 502; /api and login work)
      BACKOFFICE_URL: http://backoffice:3000
      # login: browser-facing Keycloak URL (token issuer) + direct back-channel URL (decisions.md 2b-6)
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_INTERNAL_URL: http://identity:8080
      BACKOFFICE_BFF_CLIENT_SECRET: ${BACKOFFICE_BFF_CLIENT_SECRET}
      REDIS_HOST: redis
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8088 && printf 'GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
      identity:
        condition: service_healthy
    networks:
      - shopapp-network

  storefront:
    build: ./storefront
    image: shopapp/storefront:dev
    environment:
      # server-side rendering calls the BFF on the compose network
      API_BASE_PATH_SERVER: http://storefront-bff:8087/api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    depends_on:
      storefront-bff:
        condition: service_healthy
    networks:
      - shopapp-network

  # the Next.js back office; only reachable through backoffice-bff (admin login), which routes /** here
  backoffice:
    build: ./backoffice
    image: shopapp/backoffice:dev
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    depends_on:
      backoffice-bff:
        condition: service_healthy
    networks:
      - shopapp-network

  nginx:
    image: nginx:1.30.6
    environment:
      DOMAIN: ${DOMAIN}
      NGINX_HTTP_PORT: ${NGINX_HTTP_PORT}
      # only substitute these; leave nginx's own $variables alone
      NGINX_ENVSUBST_FILTER: "^(DOMAIN|NGINX_HTTP_PORT)$$"
    ports:
      # loopback only: dev credentials must not be reachable from the LAN.
      # Same port inside and out, so containers can use the public URLs (incl. port) through the aliases below.
      - "127.0.0.1:${NGINX_HTTP_PORT}:${NGINX_HTTP_PORT}"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    depends_on:
      identity:
        condition: service_healthy
      pgadmin:
        condition: service_healthy
      kafka-ui:
        condition: service_healthy
      product:
        condition: service_healthy
      cart:
        condition: service_healthy
      customer:
        condition: service_healthy
      order:
        condition: service_healthy
      tax:
        condition: service_healthy
      location:
        condition: service_healthy
      inventory:
        condition: service_healthy
      # promotion, rating, search, media, recommendation, sampledata: optional (the pages say "not available"
      # when they are down); with the variable proxy_pass nginx starts without them (decisions.md 4-18, 4-76)
      storefront-bff:
        condition: service_healthy
      backoffice-bff:
        condition: service_healthy
    networks:
      shopapp-network:
        aliases:
          # containers reach the public issuer URL through nginx, like browsers do
          - identity.${DOMAIN}
          - api.${DOMAIN}

networks:
  shopapp-network:

volumes:
  postgres-data:
  pgadmin-data:
  kafka-data:
  redis-data:
  media-data:
  es-data:
  recommendation-model:
