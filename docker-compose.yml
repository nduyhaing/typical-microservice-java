name: shopapp

services:
  postgres:
    image: postgres:16.16
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres_init.sql:/docker-entrypoint-initdb.d/postgres_init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - shopapp-network

  pgadmin:
    image: dpage/pgadmin4:9.19.0
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # .local is a reserved domain; allow it for the dev login email
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['local']"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin-data:/var/lib/pgadmin
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/misc/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopapp-network

  identity:
    image: quay.io/keycloak/keycloak:26.8.2
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_URL}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # substituted into ${DOMAIN} placeholders of the realm import
      DOMAIN: ${DOMAIN}
    volumes:
      - ./identity/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      # the image has no curl/wget: plain HTTP over bash /dev/tcp to the management port
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopapp-network

  kafka:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s
    networks:
      - shopapp-network

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    environment:
      KAFKA_CLUSTERS_0_NAME: shopapp
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - shopapp-network

  product:
    build: ./product
    image: shopapp/product:dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/product
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_LIQUIBASE_CONTEXTS: ${PRODUCT_LIQUIBASE_CONTEXTS:-default}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      # media service comes in slice 3: images fall back to placeholders
      SHOPAPP_SERVICES_MEDIA: ""
    healthcheck:
      # the JRE image has no curl/wget and its sh is dash: plain HTTP over bash /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /product/actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopapp-network

  cart:
    build: ./cart
    image: shopapp/cart:dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cart
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      # in-network through the nginx alias, like the browser-facing API
      SHOPAPP_SERVICES_PRODUCT: http://api.${DOMAIN}:${NGINX_HTTP_PORT}/product
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /cart/actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopapp-network

  customer:
    build: ./customer
    image: shopapp/customer:dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/customer
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      # admin API straight to Keycloak on the compose network
      KEYCLOAK_ADMIN_URL: http://identity:8080
      CUSTOMER_MANAGEMENT_CLIENT_SECRET: ${CUSTOMER_MANAGEMENT_CLIENT_SECRET}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /customer/actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
    networks:
      - shopapp-network

  order:
    build: ./order
    image: shopapp/order:dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      # in-network through the nginx alias, like the browser-facing API
      SHOPAPP_SERVICES_PRODUCT: http://api.${DOMAIN}:${NGINX_HTTP_PORT}/product
      SHOPAPP_SERVICES_CART: http://api.${DOMAIN}:${NGINX_HTTP_PORT}/cart
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /order/actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopapp-network

  redis:
    image: redis:7.4.12-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data
    networks:
      - shopapp-network

  storefront-bff:
    build: ./storefront-bff
    image: shopapp/storefront-bff:dev
    environment:
      # in-network: api.${DOMAIN} is an nginx alias; same port as the host uses
      API_BASE_URL: http://api.${DOMAIN}:${NGINX_HTTP_PORT}
      STOREFRONT_URL: http://storefront:3000
      # login: browser-facing Keycloak URL (token issuer) + direct back-channel URL (decisions.md 2b-6)
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_INTERNAL_URL: http://identity:8080
      STOREFRONT_BFF_CLIENT_SECRET: ${STOREFRONT_BFF_CLIENT_SECRET}
      REDIS_HOST: redis
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8087 && printf 'GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
      identity:
        condition: service_healthy
    networks:
      - shopapp-network

  storefront:
    build: ./storefront
    image: shopapp/storefront:dev
    environment:
      # server-side rendering calls the BFF on the compose network
      API_BASE_PATH_SERVER: http://storefront-bff:8087/api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    depends_on:
      storefront-bff:
        condition: service_healthy
    networks:
      - shopapp-network

  nginx:
    image: nginx:1.30.6
    environment:
      DOMAIN: ${DOMAIN}
      NGINX_HTTP_PORT: ${NGINX_HTTP_PORT}
      # only substitute these; leave nginx's own $variables alone
      NGINX_ENVSUBST_FILTER: "^(DOMAIN|NGINX_HTTP_PORT)$$"
    ports:
      # loopback only: dev credentials must not be reachable from the LAN.
      # Same port inside and out, so containers can use the public URLs (incl. port) through the aliases below.
      - "127.0.0.1:${NGINX_HTTP_PORT}:${NGINX_HTTP_PORT}"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    depends_on:
      identity:
        condition: service_healthy
      pgadmin:
        condition: service_healthy
      kafka-ui:
        condition: service_healthy
      product:
        condition: service_healthy
      cart:
        condition: service_healthy
      customer:
        condition: service_healthy
      order:
        condition: service_healthy
      storefront-bff:
        condition: service_healthy
    networks:
      shopapp-network:
        aliases:
          # containers reach the public issuer URL through nginx, like browsers do
          - identity.${DOMAIN}
          - api.${DOMAIN}

networks:
  shopapp-network:

volumes:
  postgres-data:
  pgadmin-data:
  kafka-data:
  redis-data:
