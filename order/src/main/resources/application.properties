server.port=8080
server.servlet.context-path=/order
spring.application.name=order
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL:http://identity.shopapp.local}/realms/shopapp

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/order}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

springdoc.swagger-ui.path=/swagger-ui
springdoc.packagesToScan=com.shopapp.order
spring.liquibase.contexts=${SPRING_LIQUIBASE_CONTEXTS:default}
# product (prices at checkout) and cart (cleanup after ordering), through nginx in docker compose
shopapp.services.product=${SHOPAPP_SERVICES_PRODUCT:http://api.shopapp.local/product}
shopapp.services.cart=${SHOPAPP_SERVICES_CART:http://api.shopapp.local/cart}
# tax (rates at order time) and location (saved addresses, country/state/district lookups), straight to the containers
shopapp.services.tax=${SHOPAPP_SERVICES_TAX:http://api.shopapp.local/tax}
shopapp.services.location=${SHOPAPP_SERVICES_LOCATION:http://api.shopapp.local/location}
# promotion (coupon verify and usage), straight to the container in docker compose (decisions.md 4-54)
shopapp.services.promotion=${SHOPAPP_SERVICES_PROMOTION:http://api.shopapp.local/promotion}
# the order service's own Keycloak client (client credentials, realm role SERVICE) for product's and promotion's
# internal endpoints that give a cancelled order's stock and coupon use back (decisions.md 5-5)
shopapp.service-auth.token-uri=${SHOPAPP_SERVICE_AUTH_TOKEN_URI:${KEYCLOAK_URL:http://identity.shopapp.local}/realms/shopapp/protocol/openid-connect/token}
shopapp.service-auth.client-id=${ORDER_SERVICE_CLIENT_ID:order-service}
shopapp.service-auth.client-secret=${ORDER_SERVICE_CLIENT_SECRET:}
# retry sweep of orders that still owe their stock or coupon use back (decisions.md 5-4)
shopapp.order.goods-back-retry=${ORDER_GOODS_BACK_RETRY:PT5M}
