# Dependabot version updates. Minor and patch updates are grouped into one PR per ecosystem/directory set to keep the
# noise down; major updates come as separate PRs.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      maven-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - /storefront
      - /backoffice
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # every top-level directory with a Dockerfile (services and apps), and the Kubernetes manifests of k8s/deploy
  # (the docker ecosystem also reads image tags in Kubernetes manifests, decisions.md 6-72)
  - package-ecosystem: docker
    directories:
      - '/*'
      - '/k8s/deploy'
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  # image tags pinned in docker-compose*.yml (Postgres, Keycloak, Kafka, Elasticsearch, the observability add-on);
  # chart values (edge-deny image) follow by hand (decisions.md 6-72)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
