# Reusable: checks for one Next.js app (storefront or backoffice) - npm ci, lint, typecheck, tests, production build.
name: Node app

on:
  workflow_call:
    inputs:
      app:
        description: App directory
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24' # same major as the node:24-alpine Dockerfiles
          cache: npm
          cache-dependency-path: ${{ inputs.app }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
