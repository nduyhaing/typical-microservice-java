# Backend CI: one job per Maven module touched by the change (module list read from the root pom), each running the
# reusable maven-module.yml. A change to common-library, the root pom, checkstyle or these CI files builds every
# module. On push to master, the images of the verified services are pushed to GHCR after all module jobs are green.
name: Backend CI

on:
  push:
    branches: [master]
    paths:
      - '*/src/**'
      - '*/pom.xml'
      - '*/Dockerfile'
      - 'pom.xml'
      - 'checkstyle/**'
      - 'docker/postgres/**'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/maven-module.yml'
      - '.github/scripts/changed-modules*.sh'
  pull_request:
    branches: [master]
    paths:
      - '*/src/**'
      - '*/pom.xml'
      - '*/Dockerfile'
      - 'pom.xml'
      - 'checkstyle/**'
      - 'docker/postgres/**'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/maven-module.yml'
      - '.github/scripts/changed-modules*.sh'
  workflow_dispatch:

permissions:
  contents: read

# PR runs are cumulative (base..head), so a newer push supersedes the older run. Push runs on master only cover
# before..sha, so each push gets its own group: GitHub keeps only one *pending* run per group and cancels the
# others even without cancel-in-progress, which silently left modules unverified (decisions.md 6-68).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
      images: ${{ steps.detect.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test the module detection
        run: bash .github/scripts/changed-modules.test.sh
      - id: detect
        name: Detect changed modules
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          modules=$(bash .github/scripts/changed-modules.sh "$base" "$GITHUB_SHA")
          images=$(echo "$modules" | jq -c '.[]' -r | while read -r m; do if [ -f "$m/Dockerfile" ]; then echo "$m"; fi; done | jq -R . | jq -sc .)
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "modules: $modules"
          echo "images:  $images"

  verify:
    needs: changes
    if: ${{ needs.changes.outputs.modules != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    name: ${{ matrix.module }}
    uses: ./.github/workflows/maven-module.yml
    with:
      module: ${{ matrix.module }}

  images:
    needs: [changes, verify]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.changes.outputs.images != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.images) }}
    name: image ${{ matrix.module }}
    env:
      MODULE: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: mvn package (tests ran in the verify job)
        run: mvn -B -ntp -pl "$MODULE" -am package -DskipTests -Dcheckstyle.skip -Djacoco.skip
      - id: name
        name: Image name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "image=ghcr.io/${OWNER,,}/shopapp-${MODULE}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.module }}
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
