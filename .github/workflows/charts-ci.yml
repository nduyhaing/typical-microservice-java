# Charts CI: helm lint and schema validation (helm template | kubeconform -strict) of every chart under k8s/charts.
# Skips with a notice while the directory does not exist.
name: Charts CI

on:
  push:
    branches: [master]
    paths:
      - 'k8s/**'
      - '.github/workflows/charts-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'k8s/**'
      - '.github/workflows/charts-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v4.3.1
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: charts
        name: Find charts
        run: |
          if [ -d k8s/charts ] && find k8s/charts -name Chart.yaml | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::k8s/charts has no charts yet - nothing to validate"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - if: ${{ steps.charts.outputs.present == 'true' }}
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        if: ${{ steps.charts.outputs.present == 'true' }}
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform

      - name: helm lint + kubeconform
        if: ${{ steps.charts.outputs.present == 'true' }}
        run: |
          status=0
          # library charts cannot be rendered on their own; they are validated through the charts that use them
          for chart in $(find k8s/charts -name Chart.yaml -not -path '*/charts/*/charts/*' -exec dirname {} \; | sort); do
            echo "::group::${chart}"
            if grep -q '^dependencies:' "${chart}/Chart.yaml"; then
              helm dependency build "${chart}" || status=1
            fi
            helm lint "${chart}" || status=1
            if grep -qE '^type:[[:space:]]*library' "${chart}/Chart.yaml"; then
              echo "library chart - template rendering skipped"
            else
              helm template ci "${chart}" \
                | kubeconform -strict -ignore-missing-schemas -summary || status=1
            fi
            echo "::endgroup::"
          done
          exit $status
